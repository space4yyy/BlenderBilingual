name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: BlenderBilingual-macOS
          - os: windows-latest
            artifact: BlenderBilingual-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build app
        run: python packaging/build_app.py
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/BlenderBilingual.app BlenderBilingual-macOS.zip
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\BlenderBilingual.exe -DestinationPath BlenderBilingual-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: BlenderBilingual-*.zip
          if-no-files-found: error
