name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: BlenderBilingual-macOS
            output: BlenderBilingual-macOS.dmg
          - os: windows-latest
            artifact: BlenderBilingual-Windows
            output: BlenderBilingual-Windows.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build app
        run: python packaging/build_app.py
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir dmg-root
          ditto dist/BlenderBilingual.app dmg-root/BlenderBilingual.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Blender Bilingual" -srcfolder dmg-root -ov -format UDZO BlenderBilingual-macOS.dmg
      - name: Prepare Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist\BlenderBilingual.exe BlenderBilingual-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BlenderBilingual-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
